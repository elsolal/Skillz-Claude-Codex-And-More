description = "Affiche l'etat actuel du projet, les documents, les issues, les PRs et l'etat Git. Usage: /status"
prompt = "# Status\n\nCharge le skill `status-workflow` et execute-le en lecture seule.\n\n- Scanne les documents de planning et les stories.\n- Resume les issues et PRs GitHub disponibles.\n- Affiche la branche, le worktree et les commits recents.\n- Propose une seule prochaine action justifiee par les preuves locales.\n\nNe modifie aucun fichier, ne committe rien et ne pousse rien.\n"
